name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # または master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/lockfile" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Check microCMS environment
        run: |
          if [ -n "$MICROCMS_SERVICE_DOMAIN" ]; then echo "SERVICE_DOMAIN_SET=yes"; else echo "SERVICE_DOMAIN_SET=no"; fi
          if [ -n "$MICROCMS_API_KEY" ]; then echo "API_KEY_SET=yes"; else echo "API_KEY_SET=no"; fi
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
      - name: Test microCMS API connection
        run: |
          node --input-type=module <<'NODE'
          const url = `https://${process.env.MICROCMS_SERVICE_DOMAIN}.microcms.io/api/v1/news`;
          try {
            const response = await fetch(url, {
              headers: {
                'X-MICROCMS-API-KEY': process.env.MICROCMS_API_KEY
              }
            });
            console.log(`microCMS HTTP status: ${response.status}`);
            if (!response.ok) process.exitCode = 1;
          } catch (error) {
            console.error('microCMS connection failed:', error.cause?.code ?? error.message);
            process.exitCode = 1;
          }
          NODE
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      - name: Build with Astro
        run: npm run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4